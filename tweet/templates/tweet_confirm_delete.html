{% extends "layout.html" %}
{% block title %}
Delete Tweet - Ahsan Twitter
{% endblock %}

{% block content %}

<div class="min-h-screen flex items-center justify-center bg-gray-900 py-12 px-4">
    <div class="bg-gray-800 shadow-2xl rounded-xl p-10 w-full max-w-lg text-center animate__animated animate__fadeInDown">

        <h1 class="text-2xl font-bold text-red-400 mb-6">
            Are you sure you want to delete this tweet?
        </h1>

        <form method="post" class="space-y-4">
            {% csrf_token %}

            <button
                type="submit"
                class="w-full bg-red-600 text-white py-3 rounded-xl text-lg font-semibold
                       hover:bg-red-700 hover:shadow-xl transition-all duration-300">
                Confirm Delete
            </button>

            <a href="{% url 'tweet_list' %}"
               class="block w-full bg-gray-600 text-white py-3 rounded-xl text-lg font-semibold
                      hover:bg-gray-700 hover:shadow-xl transition-all duration-300">
                Cancel
            </a>
        </form>

    </div>
</div>

{% endblock %}
